<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09080f" />
    <title>Kaiko — Starting</title>
    <style>
      :root { color-scheme: dark; background: #09080f; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(ellipse at 50% 44%, #211126 0%, #100d18 42%, #09080f 82%);
        -webkit-app-region: drag;
      }
      .content { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 24px; animation: arrive 500ms ease-out both; -webkit-app-region: no-drag; }
      .window-controls { position: fixed; z-index: 2; top: 0; right: 0; display: flex; height: 40px; -webkit-app-region: no-drag; }
      .window-controls button { display: grid; width: 46px; height: 40px; place-items: center; padding: 0; border: 0; background: transparent; color: #c9c3d2; cursor: pointer; transition: background 120ms ease, color 120ms ease; -webkit-app-region: no-drag; }
      .window-controls button:hover { background: #ffffff12; color: #fff; }
      .window-controls button.close:hover { background: #e5485d; }
      .window-controls svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .mark { width: clamp(170px, 25vmin, 290px); height: auto; filter: drop-shadow(0 16px 42px #e72a8540); animation: float 2.8s ease-in-out 650ms infinite both; will-change: transform; }
      .title { margin-top: 12px; font-size: clamp(30px, 4vmin, 38px); font-weight: 760; line-height: 1.1; letter-spacing: .025em; animation: rise 500ms 120ms both; }
      .title span { color: #f04a9a; }
      .subtitle { margin-top: 9px; color: #a6a0b1; font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; animation: rise 500ms 220ms both; }
      .dots { display: flex; gap: 7px; margin-top: 27px; }
      .dots i { width: 5px; height: 5px; border-radius: 50%; background: #ef4b9a; animation: pulse 800ms ease-in-out infinite alternate; }
      .dots i:nth-child(2) { animation-delay: 140ms; }
      .dots i:nth-child(3) { animation-delay: 280ms; }
      @keyframes arrive { from { opacity: 0; } to { opacity: 1; } }
      @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
      @keyframes float { 0%,100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(-7px) rotate(.6deg); } }
      @keyframes pulse { from { opacity: .35; transform: scale(.75); } to { opacity: 1; transform: scale(1.18); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </head>
  <body>
    <nav class="window-controls" aria-label="Window controls">
      <button id="minimize" aria-label="Minimize window" title="Minimize"><svg viewBox="0 0 16 16"><path d="M3 8h10" /></svg></button>
      <button id="maximize" aria-label="Maximize window" title="Maximize"><svg viewBox="0 0 16 16"><rect x="3.25" y="3.25" width="9.5" height="9.5" rx="1" /></svg></button>
      <button id="close" class="close" aria-label="Close window" title="Close"><svg viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8" /></svg></button>
    </nav>
    <main class="content" aria-label="Kaiko is starting">
      <img class="mark" src="./kaiko-mark.svg" alt="" draggable="false" />
      <div class="title">Kai<span>ko</span></div>
      <div class="subtitle">Your anime, right at home</div>
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </main>
    <script>
      const api = window.electronAPI;
      const maximize = document.getElementById('maximize');
      const setMaximizedIcon = (isMaximized) => {
        maximize.title = isMaximized ? 'Restore' : 'Maximize';
        maximize.setAttribute('aria-label', isMaximized ? 'Restore window' : 'Maximize window');
        maximize.innerHTML = isMaximized
          ? '<svg viewBox="0 0 16 16"><path d="M5 3.25h7.75V11M3.25 5h7.75v7.75H3.25z" /></svg>'
          : '<svg viewBox="0 0 16 16"><rect x="3.25" y="3.25" width="9.5" height="9.5" rx="1" /></svg>';
      };
      document.getElementById('minimize').addEventListener('click', () => api?.minimizeWindow());
      maximize.addEventListener('click', async () => setMaximizedIcon(await api?.toggleMaximizeWindow()));
      document.getElementById('close').addEventListener('click', () => api?.closeWindow());
      api?.isWindowMaximized().then(setMaximizedIcon);
      api?.onWindowMaximizedChange(setMaximizedIcon);
    </script>
  </body>
</html>
